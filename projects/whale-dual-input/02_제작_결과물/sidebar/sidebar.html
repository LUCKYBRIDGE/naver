<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웨일 듀얼 인풋</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="sidebar-layout">
    <header class="app-header">
      <h1 class="brand-title">웨일 듀얼 인풋</h1>
    </header>
    <main class="card">
      <h2 class="card-title">학생 화면 연결</h2>
      <label for="site">학생이 사용할 사이트 주소</label>
      <input id="site" type="url" value="http://127.0.0.1:8765" placeholder="https://수업사이트주소" autocomplete="off">
      <p class="hint">해당 사이트만 허용한 뒤 현재 탭을 학생 화면으로 선택합니다.</p>
      <button id="select">사이트 허용 · 현재 탭 선택</button>
      <button id="connect">Windows 프로그램 연결</button>
      <p class="hint">Windows 제어창에서 같은 웨일 창의 웹페이지 영역을 지정하세요.</p>
      <div class="controls"><button id="start">ON · 독립 입력 시작</button><button id="stop">OFF · 해제</button></div>
      <button id="scroll">클릭·드래그 ↔ 스크롤</button>
      <button id="refresh">상태 새로고침</button>
      <output id="status" role="status" aria-live="polite">OFF · 학생 탭을 선택하세요.</output>
      <p class="hint">학생은 페이지 안의 키보드를 사용합니다. F9는 언제든 입력을 해제합니다.</p>
    </main>
    <footer class="app-footer">
      <span>🔒 기기 내에서 안전하게 동작합니다.</span>
    </footer>
  </div>
  <script src="sidebar.js"></script>
</body>
</html>
